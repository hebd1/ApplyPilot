# ApplyPilot search configuration
# Copy to ~/.applypilot/searches.yaml and customize for your job search.
# The wizard (applypilot init) generates a basic version automatically.
#
# Keys actually read by discovery code:
#   queries, locations, sites (JobSpy boards), defaults, exclude_titles,
#   location_accept, location_reject_non_remote, proxy, workday_max_tier
# See docs/discovery.md

# Search queries -- each has a query string and priority tier.
# Tier 1: High-priority exact matches (searched first, highest precision)
# Tier 2: Strong matches, broader scope
# Tier 3: Wide net, high volume, lower precision
queries:
  # Tier 1 — backend / full-stack aligned to Go, TypeScript, Angular
  - query: "Backend Engineer"
    tier: 1
  - query: "Backend Software Engineer"
    tier: 1
  - query: "Golang Engineer"
    tier: 1
  - query: "Go Software Engineer"
    tier: 1
  - query: "TypeScript Engineer"
    tier: 1
  - query: "Angular Developer"
    tier: 1
  - query: "Full Stack Software Engineer"
    tier: 1
  # Tier 2 — core SWE + light platform/cloud
  - query: "Software Engineer"
    tier: 2
  - query: "Senior Software Engineer"
    tier: 2
  - query: "Full Stack Engineer"
    tier: 2
  - query: "Platform Engineer"
    tier: 2
  # Tier 3 — broader net
  - query: "Software Developer"
    tier: 3
  - query: "API Engineer"
    tier: 3

# Locations to search
locations:
  - location: "Remote"
    remote: true

# Location filtering — flat lists read by jobspy/workday/smartextract
location_accept:
  - "Remote"
  - "United States"
  - "USA"
  - "US"
  - "Anywhere"
  - "Idaho"
  - "Utah"
  - "Mountain Time"
location_reject_non_remote:
  - "India only"
  - "Philippines"
  - "London only"
  - "onsite only"
  - "New York only"
  - "Seattle only"

# Country for Indeed searches
country: "USA"

# JobSpy source boards (code reads `sites`, not `boards`)
# LinkedIn often matches experience better; company-website applies resolve to
# Greenhouse/Workday/Ashby URLs for Stage 6. Easy Apply-only posts stay manual.
sites:
  - indeed
  - linkedin
  - zip_recruiter

# Search defaults
defaults:
  results_per_site: 50
  hours_old: 72

# Negative keywords — skip jobs with these in the title (case-insensitive substring)
exclude_titles:
  - "junior"
  - "jr."
  - "jr "
  - "intern"
  - "internship"
  - "co-op"
  - "sdet"
  - "qa engineer"
  - "quality assurance"
  - "quality engineer"
  - "test engineer"
  - "software development engineer in test"
  - "cloud engineer"
  - "devops"
  - "devsecops"
  - "dev sec ops"
  - "dev ops"
  - "sre"
  - "site reliability"
  - "senior director"
  - "VP "
  - "vice president"
  - "chief"
  - "clearance required"
  - "TS/SCI"
  - "principal scientist"
